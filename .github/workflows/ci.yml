name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/ai-sdk

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/ai-sdk

  package-quality:
    name: Tests, coverage, and complexity (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          START=$SECONDS
          npm run test:cov
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

      - name: Generate cognitive complexity report
        run: npm run complexity:report

      - name: Generate base cognitive complexity fallback
        if: github.event_name == 'pull_request'
        run: |
          if [ -f base-cognitive-complexity-summary.json ]; then
            exit 0
          fi

          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "${{ github.event.pull_request.base.sha }}"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$BASE_DIR/node_modules"
          (
            cd "$BASE_DIR"
            if [ -f scripts/collect-cognitive-complexity.mjs ]; then
              node scripts/collect-cognitive-complexity.mjs \
                --output "$GITHUB_WORKSPACE/base-cognitive-complexity-summary.json"
            fi
          )

      - name: Cache CI data for base branch
        if: github.event_name == 'push'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Coverage and performance summary
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const duration = fs.readFileSync('test-step-duration-ms.txt', 'utf8').trim();
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const report = [
            '### Package Quality',
            '',
            '| Metric | Value |',
            '| :--- | ---: |',
            '| Statements | ' + metrics.statements + '% |',
            '| Branches | ' + metrics.branches + '% |',
            '| Functions | ' + metrics.functions + '% |',
            '| Lines | ' + metrics.lines + '% |',
            '| Test step duration | ' + duration + ' ms |',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-quality
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            complexity/cognitive-complexity-summary.json
            test-results.json
            test-step-duration-ms.txt
          if-no-files-found: error

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate package tarball
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit

  samples:
    name: Sample validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/ai-sdk

      - name: Run sample matrix
        run: |
          START=$SECONDS
          npm run ci:sample
          echo $(( (SECONDS - START) * 1000 )) > sample-validation-duration-ms.txt

      - name: Sample matrix summary
        run: |
          DURATION_MS="$(cat sample-validation-duration-ms.txt)"
          DURATION_SECONDS="$(node -e "console.log((Number(process.argv[1]) / 1000).toFixed(2))" "$DURATION_MS")"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Sample Matrix

          | Metric | Value |
          | :--- | ---: |
          | Sample validation duration | DURATION_PLACEHOLDER |

          | Sample | AI SDK call | Enhancers exercised |
          | :--- | :--- | :--- |
          | `00-showcase` | `streamText` (mock model) | Guard, pipe, interceptor, exception filter |
          | `01-fastify-parity` | `streamText` (mock model) | Guard, pipe, exception filter on Express + Fastify |
          | `02-abort-signal` | `streamText` + `@AiAbortSignal` (mock model) | Pipe + mid-stream disconnect cancellation on Express + Fastify |
          | `03-error-mapping` | `streamText` (mock model) | Guard, pipe, exception filter (pre-stream HTTP errors) + in-stream `onError` frame mapping on Express + Fastify |
          | `04-stream-object` | `streamObject` (mock model) | Guard, pipe + partial-JSON text-delta streaming via `format: 'text'` on Express + Fastify |
          | `05-stream-ui` | `createUIMessageStream` custom data parts (v5 `streamUI` equivalent) | Guard, pipe + custom `data-*` UI part streaming on Express + Fastify |
          | `06-migration` | `streamText` / `createUIMessageStream` (mock model) | Cookbook `@Res()` vs `@AiStream` before/after: guard + pipe pre-stream errors and Fastify parity |
          | `07-tool-context` | `streamText` + tool + `@AiContext` (mock model) | Guard-attached `request.user` read by a tool `execute` via `@AiContext` on Express + Fastify |

          Samples never call a real model provider, so no API keys are used.
          EOF
          sed -i "s/DURATION_PLACEHOLDER/${DURATION_SECONDS}s (${DURATION_MS}ms)/" "$GITHUB_STEP_SUMMARY"

  nestjs-compat:
    name: NestJS ${{ matrix.nest.label }} compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range is @nestjs/common, @nestjs/core and the two
    # optional platform adapters at ^11 || ^12. The devDependencies and the
    # lockfile every other job installs stay on the 11.x in the middle of that
    # range, so this matrix is what makes its two ENDS tested claims: each leg
    # installs one end on top of the lockfile with --no-save and runs the
    # suite, the package build and the sample matrix against it.
    #
    # Three things keep a leg honest, because npm makes it easy to run a suite
    # against a tree that is not the one you asked for:
    # - --workspaces --include-workspace-root, not --workspace-root: the
    #   samples pin @nestjs/* exactly, and with the latter those pins win —
    #   npm either refuses the tree or nests the lockfile's 11 under each
    #   sample, and the sample matrix never runs on the leg's version.
    # - the install log is grepped for ERESOLVE: when npm can override a peer
    #   conflict it prints a warning and exits 0, and neither `npm ls` nor
    #   --strict-peer-deps reports it afterwards.
    # - scripts/check-nestjs-resolution.mjs proves the version from inside
    #   every workspace (exactly, at the floor), fails on nested copies, and
    #   re-checks every peer range on @nestjs/* against the hoisted copy.
    # Node is not a dimension here on purpose: 22 floats to a current 22.x,
    # which is what require(esm) on the 12 end needs (>=22.12), and the build
    # job already covers 24.
    strategy:
      fail-fast: false
      matrix:
        nest:
          # 11.0.0 is the oldest graph the published range can produce for the
          # framework set: nothing this package uses was added by a later
          # 11.x. Pinned exactly so a downgrade that silently no-ops cannot
          # pass as a floor run.
          # fastify: @nestjs/platform-fastify 11.0.0 and 11.0.1 were published
          # peering @nestjs/common and @nestjs/core ^10; 11.0.2 is the first
          # release that admits 11, so it is the oldest fastify that installs
          # next to common 11.0.0 at all. That is an install-graph fact about
          # a sibling package, not a floor of ours, so the published range does
          # not change for it.
          - { label: '11 floor', spec: '11.0.0', fastify: '11.0.2' }
          # ^12.0.0 floats, so a new 12.x patch is tested on the next run.
          - { label: '12', spec: '^12.0.0', fastify: '^12.0.0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS ${{ matrix.nest.label }} (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            "@nestjs/common@${{ matrix.nest.spec }}" \
            "@nestjs/core@${{ matrix.nest.spec }}" \
            "@nestjs/platform-express@${{ matrix.nest.spec }}" \
            "@nestjs/testing@${{ matrix.nest.spec }}" \
            "@nestjs/platform-fastify@${{ matrix.nest.fastify }}" \
            > "$RUNNER_TEMP/nestjs-install.log" 2>&1 || { cat "$RUNNER_TEMP/nestjs-install.log"; exit 1; }
          cat "$RUNNER_TEMP/nestjs-install.log"

      - name: Fail on any peer conflict npm merely warned about
        run: |
          if grep -E 'ERESOLVE' "$RUNNER_TEMP/nestjs-install.log"; then
            echo "::error::npm overrode a peer dependency instead of failing; this tree is not the graph the leg claims to test"
            exit 1
          fi

      - name: Prove every workspace resolves NestJS ${{ matrix.nest.label }}
        run: |
          node scripts/check-nestjs-resolution.mjs "${{ matrix.nest.spec }}" \
            "@nestjs/platform-fastify@${{ matrix.nest.fastify }}"

      - name: Run the suite against NestJS ${{ matrix.nest.label }}
        run: npm test

      - name: Build package against NestJS ${{ matrix.nest.label }}
        run: npm run build --workspace @nest-native/ai-sdk

      - name: Run sample matrix against NestJS ${{ matrix.nest.label }}
        run: npm run ci:sample

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build
